# Netlify: site estático, sem etapa de build. A raiz do repositório é publicada como está.
[build]
  publish = "."
  command = ""

# Tipo correto para o manifesto do app (o padrão do Netlify é genérico).
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
